<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>ScamWatch Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f6f8;color:#17212b;padding:24px}
.wrap{max-width:1000px;margin:auto}
h1{margin:0 0 16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
input,button{font:inherit;padding:10px 12px;border-radius:8px}
input{border:1px solid #ccd3da;flex:1;min-width:220px}
button{border:0;cursor:pointer;font-weight:700;background:#10243e;color:#fff}
button.tab{background:#e3e8ee;color:#17212b}
button.tab.on{background:#10243e;color:#fff}
.card{background:#fff;border:1px solid #dfe4ea;border-radius:12px;padding:18px;margin-bottom:14px}
.card h3{margin:2px 0 6px}
.meta{color:#647282;font-size:13px}
.desc{white-space:pre-wrap;word-break:break-word;margin:10px 0}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700;background:#eef2f5;margin-right:4px}
.pill.pending{background:#fff1d6}.pill.approved{background:#e3f4ea}.pill.corroborated{background:#e0eefb}.pill.rejected{background:#fde7e7}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.approve{background:#237a4b}.corrob{background:#1769aa}.reject{background:#c62828}.edit{background:#6b7785}.pend{background:#b07a00}.del{background:#222}
.card img{max-width:320px;max-height:220px;border-radius:8px;border:1px solid #dfe4ea;display:block;margin-top:8px}
#status{color:#647282;margin-bottom:10px}
</style>
</head>
<body>
  
<div class="wrap">
  <h1>🇳🇵 ScamWatch Admin</h1>
  <div class="bar">
    <input id="token" type="password" placeholder="Admin token" autocomplete="off">
    <button id="load" type="button">Load reports</button>
  </div>
  <div class="bar" id="tabs">
    <button class="tab on" data-s="pending">Pending</button>
    <button class="tab" data-s="approved">Approved</button>
    <button class="tab" data-s="corroborated">Corroborated</button>
    <button class="tab" data-s="rejected">Rejected</button>
    <button class="tab" data-s="">All</button>
  </div>
  <div id="status"></div>
  <div id="reports"></div>
</div>
<script>
const $=id=>document.getElementById(id);
let token=sessionStorage.getItem("nsw_admin")||"";
let filter="pending";
if(token)$("token").value=token;

function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
const auth=()=>({Authorization:"Bearer "+token});

async function api(path,opts={}){
  const r=await fetch(path,{...opts,headers:{...auth(),...(opts.headers||{})}});
  let d=null;try{d=await r.json()}catch{}
  if(!r.ok)throw new Error((d&&d.error)||("HTTP "+r.status));
  return d;
}

async function load(){
  token=$("token").value.trim();
  sessionStorage.setItem("nsw_admin",token);
  $("status").textContent="Loading…";
  try{
    const d=await api("/api/admin/reports"+(filter?"?status="+filter:""));
    $("status").textContent=d.reports.length+" report(s)";
    const box=$("reports");box.innerHTML="";
    for(const r of d.reports){
      const c=document.createElement("div");c.className="card";
      c.innerHTML=
        '<div class="meta">'+esc(r.case_id)+' · '+esc(new Date(r.created_at).toLocaleString())+'</div>'
       +'<h3>'+esc(r.title)+'</h3>'
       +'<span class="pill '+esc(r.status)+'">'+esc(r.status)+'</span>'
       +'<span class="pill">'+esc(r.category)+'</span><span class="pill">'+esc(r.platform)+'</span><span class="pill">Risk: '+esc(r.risk)+'</span>'
       +'<div class="desc">'+esc(r.description)+'</div>'
       +'<div><strong>Identifier:</strong> <span class="ident">'+(esc(r.identifier)||"<em>none</em>")+'</span></div>'
       +'<div class="evidence"></div>'
       +'<div class="actions"></div>';
      const acts=c.querySelector(".actions");
      const add=(label,cls,fn)=>{const b=document.createElement("button");b.textContent=label;b.className=cls;b.onclick=fn;acts.appendChild(b)};
      add("Approve","approve",()=>patch(r.case_id,{status:"approved"}));
      add("Corroborated","corrob",()=>patch(r.case_id,{status:"corroborated"}));
      add("Reject","reject",()=>patch(r.case_id,{status:"rejected"}));
      add("Back to pending","pend",()=>patch(r.case_id,{status:"pending"}));
      add("Edit identifier","edit",()=>{
        const v=prompt("Edit / mask the public identifier:",r.identifier||"");
        if(v!==null)patch(r.case_id,{identifier:v});
      });
      add("Delete","del",()=>{if(confirm("Permanently delete "+r.case_id+" and its image?"))del(r.case_id)});
      box.appendChild(c);
      if(r.evidence_key)showEvidence(c.querySelector(".evidence"),r.evidence_key);
    }
  }catch(e){$("status").textContent="Error: "+e.message}
}

// Images need the Authorization header, so fetch as blob
async function showEvidence(el,key){
  try{
    const r=await fetch("/api/admin/evidence?key="+encodeURIComponent(key),{headers:auth()});
    if(!r.ok)return;
    const img=document.createElement("img");
    img.src=URL.createObjectURL(await r.blob());
    img.alt="Evidence";
    el.appendChild(img);
  }catch(e){console.error(e)}
}

async function patch(caseId,body){
  try{
    await api("/api/admin/reports/"+encodeURIComponent(caseId),{
      method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    load();
  }catch(e){alert(e.message)}
}
async function del(caseId){
  try{await api("/api/admin/reports/"+encodeURIComponent(caseId),{method:"DELETE"});load()}
  catch(e){alert(e.message)}
}

$("load").onclick=load;
$("token").addEventListener("keydown",e=>{if(e.key==="Enter")load()});
$("tabs").addEventListener("click",e=>{
  const b=e.target.closest("button.tab");if(!b)return;
  document.querySelectorAll("#tabs .tab").forEach(t=>t.classList.remove("on"));
  b.classList.add("on");filter=b.dataset.s;
  if($("token").value.trim())load();
});
if(token)load();
</script>
</body>
</html>
